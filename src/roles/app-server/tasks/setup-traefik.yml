# Traefik
# Documentation: https://doc.traefik.io/
# Purpose: Reverse Proxy (similar to SWAG) - but with labels and no downtime
#          Although I added plugins for SWAG I wanted to give traefik a try as I'm tired of having to figure out
#          a similar config if it's there and get it to work.
- name: Create Traefik Directories
  become: true
  file:
    path: "{{ item }}"
    state: directory
    mode: 0777
  with_items:
    - "{{ host_traefik_folder_location }}/config"
    - "{{ host_traefik_folder_location }}/certs"

- name: Load the traefik configuration file
  become: true
  template:
    src: traefik.conf
    dest: "{{ host_traefik_folder_location }}/config/traefik.conf"
    owner: root
    group: root

- name: "Setup Traefik Reverse Proxy"
  docker_container:
    name: traefik
    image: traefik:v3
    pull: true
    privileged: true
    restart_policy: unless-stopped
    networks:
      - name: docker_ipvlan
        ipv4_address: "{{ traefik_container_ip }}"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/etc/timezone:/etc/timezone:ro"
      - "{{ host_traefik_folder_location }}/config/traefik.conf:/etc/traefik/traefik.yaml:ro"
      - "{{ host_traefik_folder_location}}/certs:/var/traefik/certs:rw"
    env:
      TZ: "{{ time_zone }}"
      VERSION: "docker"
      CF_API_EMAIL: "{{ contact_email }}"
      CF_DNS_API_TOKEN: "{{ cf_dns_api_token }}"
    healthcheck:
      test: traefik healthcheck --ping
      start_period: 5s
      interval: 20s
      timeout: 10s
      retries: 5
    labels:
      com.centurylinklabs.watchtower.enable: "true"
