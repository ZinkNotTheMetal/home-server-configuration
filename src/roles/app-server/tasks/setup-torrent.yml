- name: Ensure 'mount folder' is created
  become: true
  file:
    path: "{{ item }}"
    state: directory
    mode: "0777"
    owner: root
    group: root
  with_items:
    - "/mnt/nas/torrent"
    - "{{ host_qbittorrent_folder_location }}"

# Test mount
#  sudo mount -t nfs 10.10.0.10:/volume1/Media/Movies /mnt/nas/movies
#  sudo mount -t nfs 10.10.0.10:/volume1/Media/TV\ Shows /mnt/nas/tv
#  sudo mount -t nfs 10.10.0.10:/volume1/Files/Books /mnt/nas/books
# Test unmount
#  sudo umount 10.10.0.10:/backups
- name: Mount 'Torrent Data' to mount folder
  become: true
  mount:
    src: "{{ nas_ip }}:/volume1/Files/Torrent-Data"
    path: /mnt/nas/torrent
    state: mounted
    opts: rw,nolock,soft
    fstype: nfs

- name: Run 'qbittorrent' - Docker Container
  docker_container:
    name: 'qbittorrent'
    image: bmoorman/qbittorrent:latest
    restart_policy: unless-stopped
    privileged: true
    dns:
      - 1.1.1.1
      - 1.0.0.1
    networks:
      - name: docker_ipvlan
        ipv4_address: "{{ torrent_container_ip }}"
    pull: true
    volumes:
      - "/mnt/nas/torrent:/downloads"
      - "{{ host_qbittorrent_folder_location }}:/config"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/etc/timezone:/etc/timezone:ro"
    env:
      PIA_USER: "{{ vpn_username }}"
      PIA_PASS: "{{ vpn_password }}"
      TZ: "{{ time_zone }}"
      LOCAL_NETWORK: "192.168.0.0/16"
    capabilities:
      - NET_ADMIN
    devices:
      - "/dev/net/tun"
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      traefik.enable: "true"
      traefik.http.routers.torrent.entrypoints: "websecure,web"
      traefik.http.routers.torrent.tls: "true"
      traefik.http.routers.torrent.rule: "Host(`torrent.zinkzone.tech`)"
      traefik.http.routers.torrent.service: "torrent"
      traefik.http.services.torrent.loadBalancer.server.port: "8080"
      traefik.http.routers.torrent.tls.certresolver: "letsencrypt"
