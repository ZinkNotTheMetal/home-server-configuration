# Transmission
# Documentation: https://transmissionbt.com
# Purpose: To dowload Linux ISOs such as Debian & Mint
- name: Create docker data volume
  become: true
  file:
    path: "{{ host_transmission_folder_location }}"
    state: directory
    mode: "0777"
    owner: root
    recurse: yes

- name: Run 'transmission-openvpn' - Docker Container
  docker_container:
    name: transmission-openvpn
    image: haugene/transmission-openvpn
    restart_policy: unless-stopped
    networks:
      - name: curidge
    privileged: true
    pull: true
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "{{ host_transmission_folder_location }}:/data"
      - "/etc/timezone:/etc/timezone:ro"
    env:
      OPENVPN_PROVIDER: "{{ vpn_provider }}"
      OPENVPN_CONFIG: "{{ vpn_country }}"
      OPENVPN_USERNAME: "{{ vpn_username }}"
      OPENVPN_PASSWORD: "{{ vpn_password }}"
      GLOBAL_APPLY_PERMISSIONS: "true"
      CREATE_TUN_DEVICE: "true"
      PUID: "1000"
      PGID: "1000"
      HEALTH_CHECK_HOST: "google.com"
      SELFHEAL: "false"
      LOCAL_NETWORK: "192.168.0.0/16"
    capabilities:
      - NET_ADMIN
    ports:
      - 8118:8118
      - 9091:9091
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      traefik.enable: "true"
      traefik.http.routers.transmission.tls: "true"
      traefik.http.routers.transmission.entrypoints: "websecure"
      traefik.http.routers.transmission.rule: "Host(`transmission.zinkzone.tech`)"
      traefik.http.routers.transmission.service: "transmission"
      traefik.http.services.transmission.loadBalancer.server.port: "9091"

      traefik.http.routers.transmission_http.entrypoints: "web"
      traefik.http.routers.transmission_http.rule: "Host(`transmission.zinkzone.tech`)"
      traefik.http.routers.transmission_http.tls.certresolver: "cloudflare"
