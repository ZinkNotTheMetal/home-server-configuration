# Transmission
# Documentation: https://transmissionbt.com
# Purpose: To download Linux ISOs such as Debian & Mint

- name: Ensure 'mount folder' is created
  become: true
  file:
    path: "{{ item }}"
    state: directory
    mode: "0777"
    owner: root
    group: root
  with_items:
    - "/mnt/nas/transmission"

# Test mount
#  sudo mount -t nfs 10.10.0.10:/volume1/Media/Movies /mnt/nas/movies
#  sudo mount -t nfs 10.10.0.10:/volume1/Media/TV\ Shows /mnt/nas/tv
#  sudo mount -t nfs 10.10.0.10:/volume1/Files/Books /mnt/nas/books
# Test unmount
#  sudo umount 10.10.0.10:/backups
- name: Mount 'Transmission Data' to mount folder
  become: true
  mount:
    src: "{{ nas_ip }}:/volume1/Media/Movies"
    path: /mnt/nas/movies
    state: mounted
    opts: rw,nolock,soft
    fstype: nfs


- name: Create docker data volume
  become: true
  file:
    path: "{{ host_transmission_folder_location }}"
    state: directory
    mode: "0777"
    owner: root
    recurse: yes

- name: Run 'transmission-openvpn' - Docker Container
  docker_container:
    name: transmission-openvpn
    image: haugene/transmission-openvpn
    restart_policy: unless-stopped
    networks:
      - name: curidge
    pull: true
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "{{ host_transmission_folder_location }}:/data"
      - "/etc/timezone:/etc/timezone:ro"
    env:
      OPENVPN_PROVIDER: "{{ vpn_provider }}"
      OPENVPN_CONFIG: "{{ vpn_country }}"
      OPENVPN_USERNAME: "{{ vpn_username }}"
      OPENVPN_PASSWORD: "{{ vpn_password }}"
      GLOBAL_APPLY_PERMISSIONS: "true"
      CREATE_TUN_DEVICE: "true"
      PUID: "1000"
      PGID: "1000"
      HEALTH_CHECK_HOST: "google.com"
      SELFHEAL: "false"
      LOCAL_NETWORK: "192.168.0.0/16"
    capabilities:
      - NET_ADMIN
    ports:
      - 9091:9091
    labels:
      com.centurylinklabs.watchtower.enable: "true"
