http:
  routers:
    nas:
      rule: "Host(`nas.zinkzone.tech`)"
      service: nas
      priority: 1
      entryPoints:
        - websecure
        - web
      tls:
        certResolver: letsencrypt
  services:
    nas:
      loadBalancer:
        servers:
          - url: "http://192.168.100.253:5000"